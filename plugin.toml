[[capabilities.authorization.approval_schema.fields]]
path = "/messages"
label = "Stable message identities"
value_type = "json"
required = true
constraint = "subset"
risk_emphasis = "destructive"

[[capabilities.authorization.approval_schema.fields]]
path = "/destination_folder"
label = "Destination mailbox"
value_type = "path"
required = false
constraint = "exact"
risk_emphasis = "destructive"

[[capabilities]]
id = "delete"
description = "Move stable IMAP UIDs to Trash or explicitly UID-expunge them."
input_schema = "schemas/delete-input.schema.json"
output_schema = "schemas/delete-output.schema.json"
permissions = [
    "connection.write",
    "email.delete",
]
risk = "destructive"
destructive = true
streaming = false
execution_mode = "stateless"
connection_required = true
required_secret_classes = []
supports_dry_run = true
default_timeout_ms = 60000

[capabilities.authorization]
declared = true
interactive_execute = false
session_purposes = []
note = "Email writes require scoped approval, redacted preview support, an invocation acknowledgement, and an idempotency key."
capability_wide_allowed = true

[capabilities.authorization.approval_schema]
version = 1

[[capabilities.authorization.approval_schema.fields]]
path = "/messages"
label = "Stable message identities"
value_type = "json"
required = true
constraint = "subset"
risk_emphasis = "destructive"

[[capabilities.authorization.approval_schema.fields]]
path = "/destination_folder"
label = "Destination mailbox"
value_type = "path"
required = false
constraint = "exact"
risk_emphasis = "destructive"

[[capabilities]]
id = "set_flags"
description = "Apply allowlisted flags to stable IMAP UIDs with bounded partial-failure reporting."
input_schema = "schemas/set_flags-input.schema.json"
output_schema = "schemas/set_flags-output.schema.json"
permissions = [
    "connection.write",
    "email.set_flags",
]
risk = "external_side_effect"
destructive = false
streaming = false
execution_mode = "stateless"
connection_required = true
required_secret_classes = []
supports_dry_run = true
default_timeout_ms = 60000

[capabilities.authorization]
declared = true
interactive_execute = false
session_purposes = []
note = "Email writes require scoped approval, redacted preview support, an invocation acknowledgement, and an idempotency key."
