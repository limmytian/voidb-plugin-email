id = "email"
name = "Email Plugin"
version = "0.3.3"
protocol_version = "1"
description = "Email (IMAP/POP3/SMTP) remote communication and mailbox management plugin for VoidB."
license = "Apache-2.0"
homepage = "https://github.com/limmytian/voidb-plugin-email"

[runtime]
command = "voidb-plugin-email"
args = ["serve"]
transport = "stdio-jsonrpc"

[runtime.env]

[connections]
profile_schema = "schemas/profile.schema.json"
secret_classes = ["password"]

[[capabilities]]
id = "diagnostics"
description = "Return agent-safe email profile diagnostics without opening a network connection."
input_schema = "schemas/diagnostics-input.schema.json"
output_schema = "schemas/diagnostics-output.schema.json"
permissions = [
    "connection.read",
    "email.diagnostics",
]
risk = "read_only"
destructive = false
streaming = false
execution_mode = "stateless"
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 5000

[capabilities.authorization]
declared = true
interactive_execute = false
session_purposes = []
note = "Read operations are bounded and cannot use Email write permissions."
capability_wide_allowed = true

[[capabilities]]
id = "folders"
description = "List mailbox folders with message and unread counts."
input_schema = "schemas/folders-input.schema.json"
output_schema = "schemas/folders-output.schema.json"
permissions = [
    "connection.read",
    "email.folders",
]
risk = "read_only"
destructive = false
streaming = false
execution_mode = "stateless"
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 30000

[capabilities.authorization]
declared = true
interactive_execute = false
session_purposes = []
note = "Read operations are bounded and cannot use Email write permissions."
capability_wide_allowed = true

[[capabilities]]
id = "list"
description = "List message envelopes from one folder with bounded pagination."
input_schema = "schemas/list-input.schema.json"
output_schema = "schemas/list-output.schema.json"
permissions = [
    "connection.read",
    "email.list",
]
risk = "read_only"
destructive = false
streaming = false
execution_mode = "stateless"
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 30000

[capabilities.authorization]
declared = true
interactive_execute = false
session_purposes = []
note = "Read operations are bounded and cannot use Email write permissions."
capability_wide_allowed = true

[capabilities.authorization.approval_schema]
version = 1

[[capabilities.authorization.approval_schema.fields]]
path = "/folder"
label = "Mailbox folder"
value_type = "path"
required = false
constraint = "prefix"
risk_emphasis = "normal"

[[capabilities]]
id = "search"
description = "Search a bounded page of message envelopes by sender or subject."
input_schema = "schemas/search-input.schema.json"
output_schema = "schemas/search-output.schema.json"
permissions = [
    "connection.read",
    "email.search",
]
risk = "read_only"
destructive = false
streaming = false
execution_mode = "stateless"
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 30000

[capabilities.authorization]
declared = true
interactive_execute = false
session_purposes = []
note = "Read operations are bounded and cannot use Email write permissions."
capability_wide_allowed = true

[capabilities.authorization.approval_schema]
version = 1

[[capabilities.authorization.approval_schema.fields]]
path = "/folder"
label = "Mailbox folder"
value_type = "path"
required = false
constraint = "prefix"
risk_emphasis = "normal"

[[capabilities]]
id = "fetch"
description = "Fetch one message body without marking it read."
input_schema = "schemas/fetch-input.schema.json"
output_schema = "schemas/fetch-output.schema.json"
permissions = [
    "connection.read",
    "email.fetch",
]
risk = "read_only"
destructive = false
streaming = false
execution_mode = "stateless"
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 30000

[capabilities.authorization]
declared = true
interactive_execute = false
session_purposes = []
note = "Read operations are bounded and cannot use Email write permissions."
capability_wide_allowed = true

[capabilities.authorization.approval_schema]
version = 1

[[capabilities.authorization.approval_schema.fields]]
path = "/folder"
label = "Mailbox folder"
value_type = "path"
required = true
constraint = "prefix"
risk_emphasis = "normal"

[[capabilities.authorization.approval_schema.fields]]
path = "/uid"
label = "Message UID"
value_type = "integer"
required = true
constraint = "exact"
risk_emphasis = "normal"

[[capabilities]]
id = "draft"
description = "Validate and return a redacted message plan without contacting SMTP or persisting a draft."
input_schema = "schemas/draft-input.schema.json"
output_schema = "schemas/draft-output.schema.json"
permissions = [
    "connection.read",
    "email.draft",
]
risk = "read_only"
destructive = false
streaming = false
execution_mode = "stateless"
connection_required = false
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 5000

[capabilities.authorization]
declared = true
interactive_execute = false
session_purposes = []
note = "Draft planning is local validation only and returns no addresses, subject, body, paths, or attachment bytes."
capability_wide_allowed = true

[[capabilities]]
id = "send"
description = "Send a structured message after a redacted dry-run preview and acknowledgement."
input_schema = "schemas/send-input.schema.json"
output_schema = "schemas/send-output.schema.json"
permissions = [
    "connection.write",
    "email.send",
]
risk = "external_side_effect"
destructive = false
streaming = false
execution_mode = "stateless"
connection_required = true
required_secret_classes = []
supports_dry_run = true
default_timeout_ms = 120000

[capabilities.authorization]
declared = true
interactive_execute = false
session_purposes = []
note = "Email writes require scoped approval, redacted preview support, an invocation acknowledgement, and an idempotency key."
capability_wide_allowed = true

