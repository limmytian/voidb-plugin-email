version = 1

[[capabilities.authorization.approval_schema.fields]]
path = "/to"
label = "To recipients"
value_type = "string_list"
required = true
constraint = "subset"
risk_emphasis = "destructive"

[[capabilities.authorization.approval_schema.fields]]
path = "/cc"
label = "Cc recipients"
value_type = "string_list"
required = false
constraint = "subset"
risk_emphasis = "normal"

[[capabilities.authorization.approval_schema.fields]]
path = "/bcc"
label = "Bcc recipients"
value_type = "string_list"
required = false
constraint = "subset"
risk_emphasis = "destructive"

[[capabilities.authorization.approval_schema.fields]]
path = "/local_root"
label = "Attachment source root"
value_type = "path"
required = false
constraint = "exact"
risk_emphasis = "normal"

[[capabilities.authorization.approval_schema.fields]]
path = "/attachments"
label = "Attachment sources"
value_type = "json"
required = false
constraint = "subset"
risk_emphasis = "normal"

[[capabilities]]
id = "move"
description = "Move stable IMAP UIDs after UIDVALIDITY and optional MODSEQ validation."
input_schema = "schemas/move-input.schema.json"
output_schema = "schemas/move-output.schema.json"
permissions = [
    "connection.write",
