[[capabilities]]
id = "idle"
description = "Observe bounded IMAP mailbox changes with reconnect, heartbeat, cursor, cancellation, and close semantics."
input_schema = "schemas/idle-input.schema.json"
output_schema = "schemas/idle-output.schema.json"
permissions = [
    "connection.read",
    "email.idle",
]
risk = "read_only"
destructive = false
streaming = true
execution_mode = "session_only"
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 30000

[capabilities.authorization]
declared = true
interactive_execute = false
note = "IMAP IDLE session scope is one mailbox and reconnect resumes from a UIDVALIDITY/UID checkpoint."
capability_wide_allowed = true

[[capabilities.authorization.session_purposes]]
kind = "watch_stream"

[capabilities.authorization.approval_schema]
version = 1

[[capabilities.authorization.approval_schema.fields]]
path = "/resource/folder"
label = "Mailbox folder"
value_type = "path"
required = true
constraint = "exact"
risk_emphasis = "normal"

[capabilities.session_handoff]
capabilities = ["email.idle"]

[capabilities.session_handoff.purpose]
kind = "watch_stream"

[capabilities.session_handoff.live_session]
protocol_version = 1
start_risk = "read_only"

[capabilities.session_handoff.live_session.kind]
kind = "events"

[capabilities.session_handoff.live_session.resource]
resource_type = "email_mailbox"
identity_fields = ["/folder"]
audit_identity = "fingerprint"

[capabilities.session_handoff.live_session.resource.identity_schema]
additionalProperties = false
required = ["folder"]
type = "object"

[capabilities.session_handoff.live_session.resource.identity_schema.properties.folder]
maxLength = 1024
minLength = 1
type = "string"

[capabilities.session_handoff.live_session.start_parameters_schema]
additionalProperties = false
type = "object"

[capabilities.session_handoff.live_session.event_schema]
additionalProperties = false
required = [
    "uid_validity",
    "highest_uid",
    "exists",
    "highest_modseq",
    "change_kind",
    "message_content_omitted",
]
type = "object"

[capabilities.session_handoff.live_session.event_schema.properties.change_kind]
enum = [
    "snapshot",
    "message_arrival",
    "mailbox_changed",
    "uid_validity_changed",
    "reconnected",
]
type = "string"

[capabilities.session_handoff.live_session.event_schema.properties.exists]
minimum = 0
type = "integer"

[capabilities.session_handoff.live_session.event_schema.properties.highest_modseq]
minimum = 1
type = [
    "integer",
    "null",
]

[capabilities.session_handoff.live_session.event_schema.properties.highest_uid]
minimum = 0
type = "integer"

[capabilities.session_handoff.live_session.event_schema.properties.message_content_omitted]
const = true

[capabilities.session_handoff.live_session.event_schema.properties.uid_validity]
minimum = 1
type = "integer"

[capabilities.session_handoff.live_session.operations]
events = "email.idle"

[capabilities.session_handoff.live_session.buffer]
max_events = 512
max_bytes = 524288
overflow = "drop_oldest"

[capabilities.session_handoff.live_session.reconnect]
mode = "transient"
max_attempts = 5
initial_backoff_ms = 250
max_backoff_ms = 4000
resume = "best_effort_cursor"
cursor_kind = "event_id"

[capabilities.session_handoff.live_session.delivery]
backpressure = "bounded_buffer"
cursor_scope = "required"
max_read_wait_ms = 30000

[capabilities.session_handoff.live_session.delivery.heartbeat]
interval_ms = 15000
idle_timeout_ms = 60000

[capabilities.session_handoff.live_session.control]
cancel = "call_only"
close = "stop_observation"

[ui]
tui = true
raw_input = false

[requirements]
voidb_core = ">=0.3.3"
platforms = [
    "darwin",
    "linux",
    "windows",
]
